<!doctype html>
<html lang="ar" dir="rtl" class="general-app">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>البرنامج العام — شاشة العرض</title>
    <style>
/* شاشة التلفاز 1920×1080. رموز خاصة بالتلفاز مشتقة من رموز الهوية (الأخضر --general-brand، والذهبي من الشعار).
   شرط للبناء: الخط والأيقونات تُحمَّل محلياً لا عبر CDN، حتى لا تختفي عند انقطاع الإنترنت.
   المنطقة الآمنة 5%: كل ما يهم يبعد 96px عن اليمين واليسار و54px عن الأعلى والأسفل
   (الساعة داخلها أيضاً؛ المستثنى فقط زر ملء الشاشة ونقاط التقدّم ووسم «وهمي»).
   حدود القراءة من 5 م: المريح نحو 80px، والأدنى نحو 40px، ولا شيء يحتاجه الطلاب تحت 56px. */
.general-app {
  --general-font: 'Cairo', sans-serif;
  --general-canvas: #f5f7f5;
  --general-pending-bg: #faf3e4;
  --general-radius-sm: 8px;
  --tv-bg: #0b3320;        /* الأخضر --general-brand مُعتَّماً */
  --tv-bg-deep: #072414;   /* خلفية وقت الصلاة: أهدأ */
  --tv-surface: #114229;
  --tv-line: #1e5a3b;
  --tv-ink: var(--general-canvas);
  --tv-muted: #b4c8bb;
  --tv-gold: #d9bb5f;      /* ذهبي الشعار: المركز الأول، وكبسولة النقاط المضافة */
  --tv-silver: #cdd5d0;    /* المركز الثاني */
  --tv-bronze: #c98d57;    /* المركز الثالث */
  --tv-safe-x: 96px;       /* 5% من 1920 */
  --tv-safe-y: 54px;       /* 5% من 1080 */
}
.general-app, .general-app body { margin:0; height:100%; background:var(--tv-bg); overflow:hidden; }
.general-app body { font-family:var(--general-font); color:var(--tv-ink); }
.general-app *, .general-app *::before, .general-app *::after { box-sizing:border-box; }
.general-app [hidden] { display:none !important; }
.general-app h1, .general-app h2, .general-app h3, .general-app p { margin:0; }
.num { font-variant-numeric:tabular-nums; }

/* المسرح: 1920×1080 ثابت، ويُصغَّر للمعاينة على شاشة أصغر */
.tv { position:absolute; top:0; left:0; width:1920px; height:1080px; transform-origin:0 0; background:var(--tv-bg); overflow:hidden; }
.tv.idle, .tv.idle * { cursor:none !important; }

/* الرأس: شريط أصغر (72px) داخل المنطقة الآمنة */
.tv-head { position:absolute; top:var(--tv-safe-y); inset-inline:var(--tv-safe-x); height:72px; display:flex; align-items:center; justify-content:space-between; }
.tv-brand { display:flex; align-items:center; gap:28px; }
/* الشعار بلا صندوق أبيض: نسخة بيضاء من الملف نفسه على الداكن */
.tv-logo { display:block; }
.tv-logo img { display:block; height:64px; filter:brightness(0) invert(1); opacity:.94; }
.tv-sep { width:2px; height:48px; background:var(--tv-line); border-radius:2px; }
.tv-brand h1 { font-size:40px; font-weight:700; line-height:1.2; }
.tv-clock { font-size:56px; font-weight:700; line-height:1; letter-spacing:.5px; }
.tv-mock { position:absolute; top:6px; left:8px; font-size:16px; color:var(--tv-muted); border:1px solid var(--tv-line); border-radius:999px; padding:0 10px; line-height:22px; z-index:20; }

/* الشرائح */
.tv-slides { position:absolute; top:150px; bottom:var(--tv-safe-y); inset-inline:var(--tv-safe-x); }
.tv.has-date .tv-slides { bottom:148px; }
.slide { position:absolute; inset:0; display:flex; flex-direction:column; opacity:0; visibility:hidden; transition:opacity .8s ease, visibility .8s; }
.slide.active { opacity:1; visibility:visible; }
.slide-title { display:flex; align-items:center; justify-content:center; gap:20px; margin-bottom:26px; }
.slide-title h2 { font-size:56px; font-weight:700; line-height:1.2; }
.slide-icon { width:64px; height:64px; border-radius:50%; background:var(--tv-surface); display:grid; place-items:center; color:var(--tv-gold); font-size:30px; }

/* المتصدرون: عمودان حتى 5 صفوف لكلٍّ منهما، الأول من اليمين ينزل ثم اليسار (كما في الكود) */
.board { max-height:calc(var(--board-rows) * 150px + (var(--board-rows) - 1) * 14px); margin-block:auto; flex:1; min-height:0; display:grid; grid-auto-flow:column; grid-template-columns:1fr 1fr; gap:14px 32px; align-content:center; }
.leader { min-height:0; display:grid; grid-template-columns:88px minmax(0,1fr) auto; align-items:center; gap:20px; padding-inline:22px 28px; background:var(--tv-surface); border-radius:20px; }
.rank { width:88px; height:88px; border-radius:50%; display:grid; place-items:center; font-size:56px; font-weight:700; line-height:1; color:var(--tv-muted); }
/* أول ثلاث رتب: أقراص مصمتة. التعادل يشترك في اللون، والرتبة بعده تتخطّى (2، 2، ثم 4 بلا برونزي). */
.leader.top1 .rank { background:var(--tv-gold); color:var(--tv-bg); }
.leader.top2 .rank { background:var(--tv-silver); color:var(--tv-bg); }
.leader.top3 .rank { background:var(--tv-bronze); color:var(--tv-bg); }
/* الاسم 75px (7% من الارتفاع). الاسم الأطول يصغر بقدر ما يلزم حتى 60px سطراً واحداً، وإن لم يتسع فسطران بـ58px. لا شيء تحت 56px. */
.leader .name { font-size:75px; font-weight:700; line-height:1.25; white-space:nowrap; }
.leader .name.fit { font-size:var(--fit); }
.leader .name.two { font-size:58px; line-height:1.04; white-space:normal; text-wrap:balance; }
.leader .points { font-size:75px; font-weight:700; line-height:1; justify-self:end; margin-inline-start:16px; }

/* الفرسان والنجم الصاعد: بطاقة لكل مرحلة / لكل طالب */
.cards { flex:1; display:flex; justify-content:center; gap:40px; min-height:0; }
.card { min-width:0; flex:1; max-width:560px; background:var(--tv-surface); border-radius:24px; overflow:hidden; display:flex; flex-direction:column; text-align:center; }
/* اسم المرحلة عنوان البطاقة: أبيض 64px على شريط */
.card .stage { font-size:64px; font-weight:700; line-height:1.3; color:var(--tv-ink); background:var(--tv-line); padding:16px 24px; }
.card .stage::after { content:""; display:block; width:72px; height:6px; margin:10px auto 0; border-radius:6px; background:var(--tv-gold); }
.card-body { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:24px; padding:32px 32px; }
.card .kname { font-size:80px; font-weight:700; line-height:1.3; text-wrap:balance; }
.card .kname + .kname { padding-top:24px; border-top:2px solid var(--tv-line); width:100%; }
.card .muted { font-size:56px; font-weight:600; color:var(--tv-muted); line-height:1.4; text-wrap:balance; }

/* التذييل: تاريخ النتائج داخل المنطقة الآمنة، والنقاط وزر ملء الشاشة في الهامش */
.results-date { position:absolute; bottom:var(--tv-safe-y); left:50%; transform:translateX(-50%); white-space:nowrap; font-size:56px; font-weight:600; color:var(--general-pending-bg); background:#3a3214; border:2px solid #6b5a22; border-radius:999px; padding:0 40px; line-height:76px; }
.results-date i { color:var(--tv-gold); margin-inline-end:18px; font-size:44px; }
.dots { position:absolute; bottom:20px; left:50%; transform:translateX(-50%); display:flex; gap:14px; }
.dot { width:16px; height:16px; border-radius:999px; background:var(--tv-line); border:0; padding:0; cursor:pointer; transition:width .4s; }
.dot.on { background:var(--tv-gold); width:44px; }
/* يختفي بعد 3 ثوانٍ من توقّف الفأرة، ويعود عند تحريكها */
.tv-full { position:absolute; bottom:10px; left:16px; z-index:6; font:600 20px var(--general-font); color:var(--tv-muted); background:var(--tv-bg); border:2px solid var(--tv-line); border-radius:var(--general-radius-sm); padding:3px 14px; display:flex; align-items:center; gap:10px; cursor:pointer; transition:opacity .4s; }
.tv-full i { font-size:20px; }
.tv.idle .tv-full { opacity:0; pointer-events:none; }

/* الطبقات التي تغطي الشاشة */
.overlay { position:absolute; inset:0; z-index:5; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:var(--tv-safe-y) var(--tv-safe-x); }
.neutral { background:var(--tv-bg); gap:56px; }
.neutral .tv-logo img { height:200px; }
.neutral strong { font-size:96px; font-weight:700; }

/* الاحتفال: 7 ثوانٍ كما في الكود */
.cele { background:radial-gradient(ellipse at 50% 50%, #17633a 0%, var(--tv-bg) 62%); gap:12px; }
.cele-icon { width:136px; height:136px; border-radius:50%; border:4px solid var(--tv-gold); display:grid; place-items:center; color:var(--tv-gold); font-size:64px; margin-bottom:8px; }
.cele-name { font-size:128px; font-weight:700; line-height:1.2; }
/* أكبر عنصر: كبسولة ذهبية مصمتة (المرجع 11) */
.cele-added { font-size:150px; font-weight:700; line-height:1.15; color:var(--tv-bg); background:var(--tv-gold); border-radius:999px; padding:4px 96px 20px; margin:20px 0 12px; box-shadow:0 12px 40px #0006; }
.cele-meta { display:flex; gap:28px; margin-top:16px; }
.cele-meta div { font-size:58px; font-weight:600; background:var(--tv-surface); border:2px solid var(--tv-line); border-radius:999px; padding:0 48px; line-height:100px; }
/* القصاصات: دفعة قصيرة مرة واحدة عند البداية، على الطرفين وفي الشريط العلوي فقط، بعيداً عن الاسم والنقاط */
.confetti { position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0; padding:0; }
.cele > :not(.confetti) { position:relative; z-index:1; }
.confetti span { position:absolute; top:-40px; width:16px; height:30px; border-radius:3px; opacity:0; animation:burst var(--dur) cubic-bezier(.2,.6,.4,1) var(--delay) 1 both; }
@keyframes burst {
  0% { opacity:0; transform:translate(0,0) rotate(0deg); }
  8% { opacity:.9; }
  75% { opacity:.9; }
  100% { opacity:0; transform:translate(var(--dx), var(--dy)) rotate(var(--rot)); }
}

.prayer { background:var(--tv-bg-deep); gap:56px; }
.prayer-icon { width:220px; height:220px; border-radius:50%; border:4px solid var(--tv-line); display:grid; place-items:center; color:var(--tv-gold); font-size:104px; }
.prayer strong { font-size:128px; font-weight:700; line-height:1.3; }

@media (prefers-reduced-motion: reduce) { .slide, .tv-full, .dot { transition:none; } .confetti { display:none; } }


@font-face { font-family:Cairo; font-style:normal; font-weight:200 1000; font-display:swap; src:url('assets/fonts/Cairo-arabic.woff2') format('woff2'); unicode-range:U+0600-06FF,U+0750-077F,U+0870-089F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF; }
@font-face { font-family:Cairo; font-style:normal; font-weight:200 1000; font-display:swap; src:url('assets/fonts/Cairo-latin.woff2') format('woff2'); unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212,U+2215; }
.name-word { white-space:nowrap; }
svg { width:1em; height:1em; fill:currentColor; flex-shrink:0; }
.icon-defs { position:absolute; width:0; height:0; overflow:hidden; }
.results-date:empty { display:none; }
.cele-name { max-width:100%; text-wrap:balance; }
.cele-meta { max-width:100%; }
.cele-meta div { white-space:nowrap; }
.prayer strong { white-space:nowrap; }
.confetti { clip-path:polygon(0 0,100% 0,100% 100%,1760px 100%,1760px 150px,160px 150px,160px 100%,0 100%); }
</style>
</head>
<body>

<div class="tv" id="tv">
    <main id="content">
        <header class="tv-head">
            <div class="tv-brand"><span class="tv-logo"><img src="assets/brand/afdalkom-logo-horizontal-color.png" alt="أفضلكم لتعليم القرآن الكريم وعلومه"></span><span class="tv-sep" aria-hidden="true"></span><h1>البرنامج العام — مجمع الحلقات</h1></div>
            <time class="tv-clock num" id="clock"></time>
        </header>
        <div class="tv-slides" id="slides"></div>
        <footer><div class="results-date num" id="resultsDate" hidden></div><div class="dots" id="dots" aria-label="تقدّم الشرائح"></div></footer>
        <div class="overlay neutral" id="neutral"><span class="tv-logo"><img src="assets/brand/afdalkom-logo-horizontal-color.png" alt=""></span><strong>البرنامج العام</strong></div>
    </main>
    <section id="celebration" class="overlay cele" hidden>
        <div class="confetti" id="confetti" aria-hidden="true"></div>
        <div class="cele-icon"><svg aria-hidden="true"><use href="#icon-clap"></use></svg></div>
        <strong class="cele-name" id="celeName"></strong><strong class="cele-added num" id="celeAdded"></strong>
        <div class="cele-meta num"><div id="celeTotal"></div><div id="celeRank"></div></div>

</div>
