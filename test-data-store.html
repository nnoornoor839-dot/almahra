<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧪 اختبار طبقة البيانات — Data Store Test</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        /* حماية: إخفاء البرنامج قبل التحقق من تسجيل الدخول */
        body.auth-not-ready > *:not(#loginOverlay):not(#loadingOverlay) { visibility: hidden !important; }

        /* شاشة تسجيل الدخول */
        #loginOverlay {
            background: linear-gradient(135deg, #10b981, #047857);
            display: none;
            position: fixed;
            inset: 0;
            z-index: 4000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #loginOverlay.flex { display: flex; }
        #loginOverlay .login-card {
            background: white;
            border-radius: 24px;
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.3);
        }
        #loginOverlay input[type="email"],
        #loginOverlay input[type="password"] {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-family: 'Cairo', sans-serif;
            font-size: 16px;
            font-weight: 700;
            outline: none;
            direction: rtl;
            box-sizing: border-box;
            margin-top: 6px;
        }
        #loginOverlay input:focus { border-color: #10b981; box-shadow: 0 0 0 4px rgba(16,185,129,0.15); }
        #loginOverlay label { display: block; font-weight: 700; color: #374151; margin-top: 12px; font-size: 14px; }
        #loginOverlay .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            border-radius: 12px;
            font-family: 'Cairo', sans-serif;
            font-size: 18px;
            font-weight: 900;
            cursor: pointer;
            margin-top: 20px;
        }
        #loginOverlay .forgot-link {
            display: block; text-align: center; margin-top: 1rem;
            background: none; border: none; color: #6b7280; font-family: inherit; cursor: pointer;
        }
        #loginOverlay .login-error {
            background: #fef2f2; color: #991b1b;
            padding: 12px; border-radius: 10px; border: 2px solid #fecaca;
            font-weight: 700; text-align: center; margin-top: 12px;
        }

        /* شاشة التحميل */
        #loadingOverlay {
            position: fixed; inset: 0; z-index: 3000;
            background: white; display: flex; align-items: center; justify-content: center;
            transition: opacity 0.5s;
        }
        #loadingOverlay.hidden { display: none; }

        /* الحاوية */
        .container {
            max-width: 720px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .header {
            padding: 16px;
            background: linear-gradient(135deg, #f59e0b, #ea580c);
            color: white;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .header h1 { font-size: 20px; }
        .header .subtitle { font-size: 13px; opacity: 0.95; margin-top: 4px; }

        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            background: #f8fafc;
            border-radius: 10px;
            margin-bottom: 16px;
            font-size: 14px;
        }
        .user-bar button {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
            padding: 6px 14px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
        }
        .status-ok { background: #dcfce7; color: #166534; }
        .status-wait { background: #fef3c7; color: #92400e; }
        .status-err { background: #fee2e2; color: #991b1b; }

        .add-form {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }
        .add-form input {
            flex: 1;
            padding: 12px 14px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-family: inherit;
            font-size: 15px;
            outline: none;
        }
        .add-form input:focus { border-color: #667eea; }
        .add-form button {
            padding: 12px 20px;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            border: none;
            border-radius: 10px;
            font-family: inherit;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }
        .add-form button:disabled { opacity: 0.5; cursor: not-allowed; }

        .students-list {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 16px;
        }
        .list-header {
            padding: 12px 16px;
            background: #f0f4ff;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
        }
        .student-item {
            padding: 12px 16px;
            border-top: 1px solid #f1f5f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slideIn 0.3s;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
        .student-item:first-child { border-top: none; }
        .student-name { font-weight: 700; }
        .student-meta { font-size: 12px; color: #64748b; }
        .del-btn {
            background: transparent;
            border: 1px solid #ef4444;
            color: #ef4444;
            padding: 5px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
        }
        .del-btn:hover { background: #ef4444; color: white; }
        .empty { padding: 24px; text-align: center; color: #94a3b8; }

        .log {
            background: #0f172a;
            color: #22c55e;
            padding: 12px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 11px;
            max-height: 180px;
            overflow-y: auto;
            direction: ltr;
            text-align: left;
        }
        .log .err { color: #ef4444; }
        .log .info { color: #60a5fa; }
    </style>

    <!-- طبقتا المصادقة والبيانات -->
    <script type="module" src="./auth.js"></script>
    <script type="module" src="./data-store.js"></script>
</head>
<body class="auth-not-ready">

    <!-- شاشة تسجيل الدخول (نفس التي في index.html) -->
    <div id="loginOverlay">
        <div class="login-card">
            <div style="text-align:center; margin-bottom: 20px;">
                <div style="font-size: 48px;">🧪</div>
                <h1 style="font-size: 22px; margin-top: 8px;">اختبار طبقة البيانات</h1>
                <p style="color: #64748b; font-size: 13px; margin-top: 4px;">Data Store Test</p>
            </div>
            <form id="loginForm">
                <label>البريد الإلكتروني</label>
                <input type="email" id="loginEmail" required autocomplete="email">
                <label>كلمة المرور</label>
                <input type="password" id="loginPassword" required autocomplete="current-password">
                <div id="loginError" class="login-error" style="display:none"></div>
                <button type="submit" id="loginBtn" class="login-btn">🔓 دخول</button>
                <button type="button" id="forgotBtn" class="forgot-link">نسيت كلمة المرور؟</button>
            </form>
        </div>
    </div>

    <!-- شاشة التحميل -->
    <div id="loadingOverlay">
        <div style="text-align:center;">
            <div style="font-size: 48px;">⏳</div>
            <p style="margin-top: 12px; font-weight: 700;">جاري التحميل...</p>
        </div>
    </div>

    <!-- المحتوى الفعلي -->
    <div class="container">
        <div class="header">
            <h1>🧪 اختبار طبقة البيانات</h1>
            <div class="subtitle">التحقق من عمل data-store.js مع Firestore</div>
        </div>

        <div class="user-bar">
            <div>
                <span id="authUserInfo" style="display:none;"></span>
                <span id="dataStatus" class="status-badge status-wait">⏳ جاري تحميل البيانات...</span>
            </div>
            <button id="authLogoutBtn" onclick="almahraLogout()" style="display:none;">
                <i class="fas fa-sign-out-alt"></i> خروج
            </button>
        </div>

        <div class="add-form">
            <input type="text" id="nameInput" placeholder="اسم الطالب التجريبي..." maxlength="50">
            <button id="addBtn" onclick="addStudent()" disabled>+ إضافة طالب</button>
        </div>

        <div class="students-list">
            <div class="list-header">
                <span>📋 قائمة الطلاب (مباشرة من Firestore)</span>
                <span id="countDisplay">0</span>
            </div>
            <div id="studentsList">
                <div class="empty">لا يوجد طلاب — أضف واحداً</div>
            </div>
        </div>

        <div class="log" id="log">[boot] test page loaded</div>
    </div>

    <script>
        // ================================================================
        // منطق الاختبار
        // ================================================================
        function log(msg, type = '') {
            const el = document.getElementById('log');
            const time = new Date().toLocaleTimeString('en-US', { hour12: false });
            const cls = type ? type : '';
            el.innerHTML = `<div class="${cls}">[${time}] ${msg}</div>` + el.innerHTML;
            const lines = el.querySelectorAll('div');
            if (lines.length > 30) lines[lines.length - 1].remove();
        }

        function setStatus(state, text) {
            const el = document.getElementById('dataStatus');
            el.className = 'status-badge status-' + state;
            el.textContent = text;
        }

        function renderList(students) {
            const list = document.getElementById('studentsList');
            const countEl = document.getElementById('countDisplay');
            countEl.textContent = students.length;

            if (students.length === 0) {
                list.innerHTML = '<div class="empty">لا يوجد طلاب — أضف واحداً</div>';
                return;
            }

            list.innerHTML = students.map(s => `
                <div class="student-item">
                    <div>
                        <div class="student-name">${escapeHtml(s.name || '(بلا اسم)')}</div>
                        <div class="student-meta">ID: ${s.id}</div>
                    </div>
                    <button class="del-btn" data-id="${s.id}">🗑️ حذف</button>
                </div>
            `).join('');

            list.querySelectorAll('.del-btn').forEach(btn => {
                btn.addEventListener('click', () => removeStudent(btn.dataset.id));
            });
        }

        function escapeHtml(str) {
            if (!str) return '';
            const d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        }

        async function addStudent() {
            const input = document.getElementById('nameInput');
            const name = input.value.trim();
            if (!name) { input.focus(); return; }

            const btn = document.getElementById('addBtn');
            btn.disabled = true;
            btn.textContent = '...';

            const id = Date.now(); // معرّف بسيط للاختبار
            const result = await window.almahraData.upsertStudent({
                id: id,
                name: name,
                history: {}
            });

            if (result.success) {
                log(`✅ أُضيف: "${name}" (id: ${id})`, 'info');
                input.value = '';
                input.focus();
            } else {
                log(`❌ فشل: ${result.error}`, 'err');
                alert('فشل الإضافة: ' + result.error);
            }

            btn.disabled = false;
            btn.textContent = '+ إضافة طالب';
        }

        async function removeStudent(id) {
            if (!confirm('حذف هذا الطالب من السحابة؟')) return;
            const result = await window.almahraData.removeStudent(id);
            if (result.success) {
                log(`🗑️ حُذف طالب (id: ${id})`, 'info');
            } else {
                log(`❌ فشل الحذف: ${result.error}`, 'err');
            }
        }

        // ================================================================
        // البدء بعد اكتمال المصادقة
        // ================================================================
        window.addEventListener('almahra-auth-ready', (e) => {
            const auth = e.detail;
            log(`🔐 تسجيل الدخول: ${auth.currentUser.email} (${auth.currentRole})`, 'info');

            if (auth.currentRole !== 'admin') {
                setStatus('err', '❌ يتطلب صلاحية مشرف');
                document.getElementById('addBtn').disabled = true;
                log('❌ ليس لديك صلاحية admin', 'err');
                return;
            }

            // اشتراك بالمزامنة اللحظية
            window.almahraData.subscribeStudents((students) => {
                setStatus('ok', '✅ متصل بـ Firestore');
                document.getElementById('addBtn').disabled = false;
                renderList(students);
                log(`🔄 استُقبل: ${students.length} طالب`, 'info');
            });

            // إخفاء شاشة التحميل
            document.getElementById('loadingOverlay')?.classList.add('hidden');
        });

        // Enter key
        document.getElementById('nameInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addStudent();
        });
    </script>
</body>
</html>
